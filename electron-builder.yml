appId: dev.adirm.readerpet
productName: ReaderPet
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
extraResources:
  - from: src/shared/personas.yaml
    to: personas.yaml
  - from: resources/pet-sprites
    to: pet-sprites
    filter:
      - "**/*"
      - "!README.md"
  - from: resources/portrait
    to: portrait
    filter:
      - "**/*"
asarUnpack:
  - "**/*.{node,dll}"
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ReaderPet-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: 九十九夜梦
